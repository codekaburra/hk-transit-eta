name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-server

    # The handlers and seeding are mostly SQL, so they are tested against a
    # real engine — well-formed SQL can still join, order or upsert wrongly.
    # Without TEST_DATABASE_URL those tests skip, so CI must provide one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hkbus
          POSTGRES_PASSWORD: hkbus_password
          POSTGRES_DB: hkbus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hkbus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://hkbus:hkbus_password@localhost:5432/hkbus_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum
      - run: go build ./...
      - run: go vet ./...

      # Coverage goes to the run summary rather than a badge: a badge needs a
      # third-party service, an account and a token — a lot of setup for one
      # number. This appears on every run with none of that.
      - name: Test with coverage
        run: |
          go test -coverprofile=coverage.out ./... | tee /tmp/go-test.txt
          {
            echo "### Backend coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
            echo
            echo "<details><summary>Per package</summary>"
            echo
            echo '```'
            cat /tmp/go-test.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: React (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-ui/package-lock.json
      - run: npm ci

      - name: Test with coverage
        env:
          CI: "true"
        run: |
          npm test -- --coverage --watchAll=false \
            --coverageReporters=text-summary | tee /tmp/web-test.txt
          {
            echo "### Frontend coverage"
            echo
            echo '```'
            grep -E "Statements|Branches|Functions|Lines" /tmp/web-test.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      # Runs against the real stack: nginx serving the built SPA, the Go
      # backend, and Postgres seeded from the committed snapshot. Unit tests
      # mock the API, so only this proves the pieces work together.
      - name: Start the stack
        run: docker compose up -d --build
        env:
          FRONTEND_PORT: "80"
          CORS_ORIGINS: http://localhost

      - name: Wait for the backend to seed
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://localhost/api/num-routes?type=bus" >/dev/null; then
              echo "stack ready"; exit 0
            fi
            sleep 5
          done
          echo "stack did not come up" >&2
          docker compose logs --tail=50 >&2
          exit 1

      - run: npx playwright test --project=chromium

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
