name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -coverprofile=coverage.out ./...
      # Reported under its own flag so backend and frontend coverage stay
      # separate — they have very different shapes and move independently.
      - uses: codecov/codecov-action@v5
        with:
          files: ./go-server/coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage reporting must never be what fails a build.
          fail_ci_if_error: false

  web:
    name: React (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-ui/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage --watchAll=false
        env:
          CI: "true"
      - uses: codecov/codecov-action@v5
        with:
          files: ./react-ui/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
