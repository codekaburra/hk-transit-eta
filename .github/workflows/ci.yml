name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: React (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-ui/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          CI: "true"
