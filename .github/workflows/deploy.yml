name: Deploy

# Auto-deploys to the EC2 instance after CI passes on main. Also runnable
# manually from the Actions tab (workflow_dispatch).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST     public IP or DNS of the instance
#   EC2_SSH_KEY  private SSH key (PEM) authorized on the instance
#   EC2_USER     SSH user (optional; defaults to ec2-user)
#   EC2_APP_DIR  repo path on the box (optional; defaults to ~/hk-transit-eta)
#
# If EC2_HOST is unset the job skips cleanly, so this is safe to merge before
# the secrets exist.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only after a successful CI run (or a manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check that deploy secrets are configured
        id: guard
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST secret not set — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.guard.outputs.skip != 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR || '~/hk-transit-eta' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            "cd $EC2_APP_DIR && ./deploy/deploy.sh"
