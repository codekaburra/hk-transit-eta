services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: hkbus
      POSTGRES_USER: hkbus
      POSTGRES_PASSWORD: hkbus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hkbus"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: go-server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgres://hkbus:hkbus_password@db:5432/hkbus?sslmode=disable
      PORT: "8080"
      CORS_ORIGINS: "http://localhost,http://localhost:80"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./react-ui
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
