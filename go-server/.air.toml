root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "tmp/main"
  delay = 1000            # ms to wait before rebuilding after a change
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  kill_delay = "200ms"
  rerun = false

[log]
  time = false

[color]
  main     = "magenta"
  watcher  = "cyan"
  build    = "yellow"
  runner   = "green"

[misc]
  clean_on_exit = true
